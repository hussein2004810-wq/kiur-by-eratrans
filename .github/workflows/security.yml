name: Security Scan (Strix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    name: Build & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Static Typecheck
        run: pnpm typecheck

      - name: Production Bundle Build & Performance Budget
        run: pnpm build

      - name: Automated Node.js Test Suite (29 Suites)
        run: pnpm test:node

      - name: Production Security Audit (Blocks on High/Critical)
        run: pnpm audit --prod --audit-level=high

  strix-security-scan:
    name: Strix AI Pentest & Security Audit
    runs-on: ubuntu-latest
    needs: [quality-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for diff-scoped vulnerability analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Core Security Verification Suite
        run: |
          node scripts/test-security.mjs
          node scripts/test-scoped-access.mjs
          node scripts/test-student-bans.mjs
          node scripts/test-auth-extensions.mjs
          node scripts/test-governance-features.mjs
          node scripts/test-theme-ui.mjs
          node scripts/test-stitch-modules.mjs
          node scripts/test-smart-review.mjs
          node scripts/test-gamification-ui.mjs
          node scripts/test-student-profile-ui.mjs
          node scripts/test-owner-auth-hardening.mjs

      - name: Install Pinned Strix CLI (v1.3.0)
        run: |
          VERSION="1.3.0"
          curl -sSL "https://github.com/usestrix/strix/releases/download/v${VERSION}/strix-${VERSION}-linux-x86_64.tar.gz" -o strix.tar.gz || (curl -sSL https://strix.ai/install | VERSION=1.3.0 bash)
          if [ -f strix.tar.gz ]; then
            tar -xzf strix.tar.gz
            mkdir -p "$HOME/.strix/bin"
            chmod +x strix
            mv strix "$HOME/.strix/bin/"
            echo "$HOME/.strix/bin" >> $GITHUB_PATH
          fi

      - name: Run Strix Vulnerability Pentest
        if: env.STRIX_LLM != '' && env.LLM_API_KEY != ''
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          DIFF_BASE="origin/${BASE_BRANCH:-main}"
          strix -n -t ./ --scan-mode quick --scope-mode diff --diff-base "$DIFF_BASE" --max-budget 10

      - name: Verify Scan Completed
        if: env.STRIX_LLM != '' && env.LLM_API_KEY != ''
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          if [ -f "$run_json" ]; then
            status=$(jq -r .status "$run_json")
            if [ "$status" != "completed" ]; then
              echo "Strix run status is '$status' — scan did not complete. Raise --max-budget." >&2
              exit 1
            fi
          fi

      - name: Upload Security Findings (SARIF)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: strix_runs
